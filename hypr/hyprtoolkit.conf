# ~/.config/hypr/hyprtoolkit.conf
# A vibrant, high-contrast cyber-synthwave theme for Hypr ecosystem apps

# --- Color Palette (ARGB format: 0xAAFFrrggbb) ---
background = 0xFF0D0E15         # Deep obsidian space
base = 0xFF161925               # Dark navy-slate for structural elements
alternate_base = 0xFF22263B     # Lighter slate for cards/hover elements

text = 0xFFC3C7DB               # Clean, soft silver-white for primary readability
bright_text = 0xFFFFFFFF        # Crisp, pure white for emphasized headers

accent = 0xFF00F5D4             # Electric neon teal for active focus & success toggles
accent_secondary = 0xFFFF007F   # Hot cyberpunk magenta for secondary highlights & alerts

# --- Typography ---
font_family = JetBrains Sans, Inter, Sans Serif
font_family_monospace = JetBrainsMono Nerd Font, monospace

h1_size = 20
h2_size = 16
h3_size = 13
font_size = 11
small_font_size = 9

# --- UI Geometry & Icons ---
rounding_large = 12             # Smooth, modern corners for main windows & large surfaces
rounding_small = 6              # Subtle rounding for input fields, sliders, and buttons

icon_theme = Papirus-Dark       # Clean, modern vector icon pack
