
$accent = rgba(180, 190, 254, 1.0)
$text = rgba(228, 228, 228, 1.0)
$muted = rgba(228, 228, 228, 0.5)

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = false
}

# -------------------- BACKGROUND --------------------
background {
    monitor = 
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 0.9
    brightness = 0.62      # wallpaper'ı koyulaştırır, metinler okunur kalır
    vibrancy = 0.18
    vibrancy_darkness = 0.5
}

# Tüm elemanlar valign = top + monitor üst kenarından (y) mesafe ile
# dikey olarak sıralanıyor, böylece hiçbiri üst üste binmiyor.
# Sıra: Saat -> Tarih -> [boşluk büyür] -> Şifre kutusu -> Kullanıcı adı

# -------------------- TIME --------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $text
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 30
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.6)
}

# -------------------- DATE --------------------
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $muted
    font_size = 16
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, -40
    halign = center
    valign = center
}

# -------------------- KİLİT İKONU / DURUM --------------------
label {
    monitor =
    text = cmd[update:1000] echo "$([ -f /tmp/hyprlock_caps ] && echo '⇪ Caps Lock Açık' || echo '')"
    color = rgba(255, 180, 100, 0.9)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

# -------------------- PASSWORD BOX --------------------
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(198, 198, 198, 0.82)
    inner_color = rgba(8, 8, 8, 0.9)
    font_color = $text
    fade_on_empty = true
    fade_timeout = 1200
    placeholder_text = <span foreground="##c6c6c6">password</span>
    hide_input = false
    rounding = 24
    check_color = $accent
    fail_color = rgba(220, 90, 90, 0.9)
    fail_text = invalid password
    fail_timeout = 1500
    fail_transition = 100
    capslock_color = rgba(255, 180, 100, 0.9)
    position = 0, -100
    halign = center
    valign = center
}

# -------------------- USERNAME --------------------
label {
    monitor =
    text = $USER
    color = $muted
    font_size = 13
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 30
    halign = center
    valign = bottom
}
